<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CipherVault — Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- Left panel -->
    <section class="panel panel--dark">
      <div class="brand">
        <span class="brand__icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 5v6c0 5.25 3.4 9.74 8 11 4.6-1.26 8-5.75 8-11V5l-8-3z" fill="white"/>
          </svg>
        </span>
        <span class="brand__name">CipherVault</span>
      </div>

      <div class="badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 5v6c0 5.25 3.4 9.74 8 11 4.6-1.26 8-5.75 8-11V5l-8-3z" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        AES Encryption
      </div>

      <div class="hero">
        <h1>
          Your notes,<br>
          <span class="hero__accent">locked down tight.</span>
        </h1>
        <p class="hero__sub">
          Register, sign in, and access a private vault secured with
          JWT sessions and industry-standard password hashing.
        </p>
      </div>
    </section>

    <!-- Right panel -->
    <section class="panel panel--light">
      <div class="form-wrap">

        <p class="eyebrow">Welcome back</p>
        <h2 class="title">Sign in</h2>
        <p class="subtitle">Access your secured vault and personal notes.</p>

        <form id="signin-form" novalidate>

          <label class="field-label" for="email">Email address</label>
          <input
            class="input"
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

          <label class="field-label" for="password">Password</label>
          <div class="password-field">
            <input
              class="input"
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-visibility" id="toggle-password" aria-label="Show password">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </button>
          </div>

          <div class="row">
            <label class="checkbox">
              <input type="checkbox" id="remember" name="remember" checked>
              <span class="checkbox__box"></span>
              Remember me
            </label>

            <button type="button" class="link-button" id="use-demo">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2-6.3-4.5-6.3 4.5 2.3-7.2-6-4.6h7.6z" fill="currentColor"/>
              </svg>
              Use demo
            </button>
          </div>

          <button type="submit" class="submit-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Sign in
          </button>

          <p class="footer-text">
            No account yet? <a href="#" id="create-account">Create one</a>
          </p>

        </form>
      </div>
    </section>

  </div>

<script src="script.js"></script>
</body>
</html>
